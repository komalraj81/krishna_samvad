    <style>
        :root {
            --primary-color: #d97706;
            --bg-color: #fef3c7;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .top {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .brand span {
            font-size: 14px;
            color: #6b7280;
        }

        .section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 16px;
            margin-bottom: 12px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .result-box {
            display: none;
            background: #fffbeb;
            border-left: 4px solid var(--primary-color);
            padding: 16px;
            border-radius: 4px;
            margin-top: 16px;
        }

        .share-btn {
            background-color: #25d366;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top">
        <div class="brand">🕉 KrishnaSamvad <span>by HBCN</span></div>
        <p>अपनी भावना चुनिए और भगवद गीता के ज्ञान से समाधान खोजिए।</p>
    </div>

    <div class="section">
        <label for="emotion">आप क्या महसूस कर रहे हैं?</label>
        <select id="emotion">
            <option value="">-- भावना चुनें --</option>
            <option value="chinta">चिंता (Anxiety)</option>
            <option value="krodh">क्रोध (Anger)</option>
            <option value="tanaav">तनाव (Stress)</option>
        </select>
    </div>

    <button onclick="getWisdom()">समाधान प्राप्त करें</button>

    <div id="resultBox" class="result-box">
        <h3 id="resultTitle"></h3>
        <p id="resultText"></p>
        <button class="share-btn" onclick="shareWisdom()">WhatsApp पर साझा करें</button>
    </div>
</div>

<script>
    const wisdomData = {
        chinta: {
            title: "चिंता का समाधान",
            text: "कर्मण्येवाधिकारस्ते मा फलेषु कदाचन।\nतुम्हारा अधिकार केवल कर्म पर है, उसके फलों पर कभी नहीं। भविष्य की चिंता छोड़कर वर्तमान कार्य पर ध्यान केंद्रित करें।"
        },
        krodh: {
            title: "क्रोध का समाधान",
            text: "क्रोधाद्भवति संमोहः संमोहात्स्मृतिविभ्रमः।\nक्रोध से भ्रम उत्पन्न होता है और भ्रम से बुद्धि का नाश होता है। शांत मन से निर्णय लें।"
        },
        tanaav: {
            title: "तनाव का समाधान",
            text: "न हि कश्चित्क्षणमपि जातु तिष्ठत्यकर्मकृत्।\nपरिणाम की इच्छा त्यागकर निष्काम भाव से अपना कर्तव्य करते रहें।"
        }
    };

    let currentSolution = "";

    function getWisdom() {
        const selected = document.getElementById('emotion').value;
        const resultBox = document.getElementById('resultBox');
        
        if (!selected) {
            alert("कृपया कोई एक भावना चुनें।");
            return;
        }

        const data = wisdomData[selected];
        document.getElementById('resultTitle').innerText = data.title;
        document.getElementById('resultText').innerText = data.text;
        
        currentSolution = `🕉 KrishnaSamvad by HBCN\n\n${data.title}\n${data.text}\n\nऔर जानें: ${window.location.href}`;
        resultBox.style.display = 'block';
    }

    function shareWisdom() {
        if (navigator.share) {
            navigator.share({
                title: 'KrishnaSamvad Wisdom',
                text: currentSolution,
                url: window.location.href
            }).catch(console.error);
        } else {
            const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(currentSolution)}`;
            window.open(waUrl, '_blank');
        }
    }
</script>

</body>
</html>
